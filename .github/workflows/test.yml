name: test

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 test/structure.py
