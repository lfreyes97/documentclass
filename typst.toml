[package]
name = "documentclass"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["Luis F. Reyes <https://github.com/lfreyes97>"]
license = "MIT"
description = "LaTeX-style document classes (book, report, article, essay) with role-based fonts, translated labels and margin notes."
